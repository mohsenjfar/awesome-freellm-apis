# Shared provider registry — source of truth for ALL agents on this system.
# Generic: no personal names, no API keys (keys live in each agent's own .env).
# Upstream files (README.*, build_model_index.py) are auto-synced — do not edit;
# everything local lives under shared/.

version: 1
updated: 2026-09-14

providers:
  - slug: nvidia
    name: NVIDIA NIM
    base_url: https://integrate.api.nvidia.com/v1
    api_mode: chat_completions
    key_url: https://build.nvidia.com/settings/api-keys
    key_env: NVIDIA_API_KEY
    no_credit_card: true # phone verification
    strength: coding + general, 40 RPM, no daily token cap
    models:
      - nvidia/nemotron-3-ultra-550b-a55b
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - nvidia/llama-3.1-nemotron-ultra-253b-v1
      - moonshotai/kimi-k3
      - deepseek-ai/deepseek-v4-pro-0813

  - slug: google-ai-studio
    name: Google AI Studio
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_mode: chat_completions
    key_url: https://aistudio.google.com/app/apikey
    key_env: GOOGLE_API_KEY
    no_credit_card: true
    strength: long-context reader/summarizer (1M ctx), multimodal
    models:
      - gemini-3.7-flash
      - gemini-3.6-flash
      - gemini-3.5-flash

  - slug: opencode
    name: OpenCode Zen
    base_url: https://opencode.ai/zen/v1
    api_mode: chat_completions
    key_url: https://opencode.ai/auth
    key_env: OPENCODE_API_KEY
    no_credit_card: true
    strength: general fallback pool
    models:
      - muse-spark-1.3-contributor-free
      - deepseek-v4-flash-free
      - mimo-v2.5-free

  - slug: groq
    name: Groq
    base_url: https://api.groq.com/openai/v1
    api_mode: chat_completions
    key_url: https://console.groq.com/keys
    key_env: GROQ_API_KEY
    no_credit_card: true
    strength: fastest inference, Llama/Qwen/DeepSeek-R1
    models:
      - llama-3.3-70b-versatile
      - qwen/qwen3-32b
      - openai/gpt-oss-120b

  - slug: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    key_url: https://openrouter.ai/workspaces/default/keys
    key_env: OPENROUTER_API_KEY
    no_credit_card: true
    strength: one key, many free models (single endpoint)
    models:
      - nvidia/nemotron-3-ultra-550b-a55b:free
